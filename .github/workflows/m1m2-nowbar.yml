name: M1-M2 Now Bar

on:
  push:
    branches:
      - feature/nowbar-m1m2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1m2-nowbar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Create CI signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/m1m2-ci.jks" \
            -storepass m1m2-ci-password \
            -keypass m1m2-ci-password \
            -alias m1m2-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=AmbientMusicMod M1M2 CI, OU=NowBar, O=Local Test, C=MX"
          cat > local.properties <<EOF
          storeFile=$RUNNER_TEMP/m1m2-ci.jks
          storePassword=m1m2-ci-password
          keyAlias=m1m2-ci
          keyPassword=m1m2-ci-password
          EOF

      - name: Unit tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile publisher instrumentation tests
        shell: bash
        run: |
          ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Build production-source APK
        shell: bash
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Hash APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          sha256sum "$APK" | tee M1M2-APK-SHA256.txt
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload M1-M2 APK
        uses: actions/upload-artifact@v4
        with:
          name: AmbientMusicMod-M1M2-NowBar-Android16
          path: |
            ${{ env.APK_PATH }}
            M1M2-APK-SHA256.txt
          if-no-files-found: error
          retention-days: 14
