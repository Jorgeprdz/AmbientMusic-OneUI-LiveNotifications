name: M1-M2 Now Bar

on:
  push:
    branches:
      - feature/nowbar-m1m2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1m2-nowbar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NOWBAR_KEYSTORE_B64: ${{ secrets.NOWBAR_KEYSTORE_B64 }}
      NOWBAR_STORE_PASSWORD: ${{ secrets.NOWBAR_STORE_PASSWORD }}
      NOWBAR_KEY_ALIAS: ${{ secrets.NOWBAR_KEY_ALIAS }}
      NOWBAR_KEY_PASSWORD: ${{ secrets.NOWBAR_KEY_PASSWORD }}
      NOWBAR_CERT_SHA256: ${{ secrets.NOWBAR_CERT_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Load stable Now Bar signing key
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            NOWBAR_KEYSTORE_B64 \
            NOWBAR_STORE_PASSWORD \
            NOWBAR_KEY_ALIAS \
            NOWBAR_KEY_PASSWORD \
            NOWBAR_CERT_SHA256
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/nowbar-stable.p12"
          printf '%s' "$NOWBAR_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          KEY_CERT="$(
            keytool -list -v \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -storepass "$NOWBAR_STORE_PASSWORD" \
              -alias "$NOWBAR_KEY_ALIAS" \
              | sed -n 's/^[[:space:]]*SHA256: //p' \
              | head -n1 \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"

          test -n "$KEY_CERT"
          test "$KEY_CERT" = "$NOWBAR_CERT_SHA256"

          cat > local.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$NOWBAR_STORE_PASSWORD
          keyAlias=$NOWBAR_KEY_ALIAS
          keyPassword=$NOWBAR_KEY_PASSWORD
          EOF

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "STABLE_CERT_SHA256=$KEY_CERT" >> "$GITHUB_ENV"

      - name: Unit tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile publisher instrumentation tests
        shell: bash
        run: |
          ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Build production-source APK
        shell: bash
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Verify stable certificate and hash APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          APK_SIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          CERT="$($APK_SIGNER verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"

          test -n "$CERT"
          test "$CERT" = "$NOWBAR_CERT_SHA256"

          sha256sum "$APK" | tee M1M2-APK-SHA256.txt
          {
            echo "CERT_SHA256=$CERT"
            echo 'STABLE_CERT_MATCH=PASS'
          } | tee M1M2-SIGNING-REPORT.txt

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload M1-M2 APK
        uses: actions/upload-artifact@v4
        with:
          name: AmbientMusicMod-M1M2-NowBar-Android16
          path: |
            ${{ env.APK_PATH }}
            M1M2-APK-SHA256.txt
            M1M2-SIGNING-REPORT.txt
          if-no-files-found: error
          retention-days: 14
