name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Create ephemeral CI signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/ci-debug.p12"
          keytool -genkeypair \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass ci-only-password \
            -keypass ci-only-password \
            -dname "CN=CI Ephemeral, O=Ambient Music for One UI" \
            -noprompt

          cat > local.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=ci-only-password
          keyAlias=ci
          keyPassword=ci-only-password
          EOF

      - name: Smoke-test Android 16 PAM binary-manifest packaging
        shell: bash
        run: |
          set -euo pipefail

          PAM="$RUNNER_TEMP/PixelAmbientMusic-1.3.5-official.apk"
          PATCH_DIR="$RUNNER_TEMP/pam-manifest-patch"
          UNSIGNED="$RUNNER_TEMP/pam-patched-unaligned.apk"
          ALIGNED="$RUNNER_TEMP/pam-patched-aligned.apk"
          SIGNED="$RUNNER_TEMP/pam-patched-signed.apk"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          curl -fL --retry 3 \
            'https://github.com/KieronQuinn/NowPlaying/releases/download/1.3.5/NowPlaying-v1.3.5.apk' \
            -o "$PAM"
          echo '11e3f12439d1b00e93174c6d2d9d6ff9000daec4e0bd03711d52cb25310223c1  '"$PAM" \
            | sha256sum -c -

          mkdir -p "$PATCH_DIR"
          unzip -p "$PAM" AndroidManifest.xml > "$PATCH_DIR/AndroidManifest.xml"
          python3 scripts/patch_pam_manifest.py "$PATCH_DIR/AndroidManifest.xml"
          python3 scripts/patch_pam_manifest.py --verify "$PATCH_DIR/AndroidManifest.xml"

          cp "$PAM" "$UNSIGNED"
          (
            cd "$PATCH_DIR"
            zip -q -0 "$UNSIGNED" AndroidManifest.xml
          )

          test "$(unzip -Z1 "$UNSIGNED" | grep -cx 'AndroidManifest.xml')" -eq 1
          unzip -p "$UNSIGNED" AndroidManifest.xml > "$RUNNER_TEMP/manifest-after-zip.bin"
          python3 scripts/patch_pam_manifest.py --verify "$RUNNER_TEMP/manifest-after-zip.bin"

          "$BUILD_TOOLS/aapt2" dump xmltree \
            --file AndroidManifest.xml "$UNSIGNED" \
            > "$RUNNER_TEMP/pam-manifest-tree.txt"
          grep -Fq 'pageSizeCompat' "$RUNNER_TEMP/pam-manifest-tree.txt"
          grep -Fq 'debuggable' "$RUNNER_TEMP/pam-manifest-tree.txt"

          "$BUILD_TOOLS/zipalign" -f -P 16 -v 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/ci-debug.p12" \
            --ks-type PKCS12 \
            --ks-key-alias ci \
            --ks-pass pass:ci-only-password \
            --key-pass pass:ci-only-password \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$SIGNED"

          unzip -p "$SIGNED" AndroidManifest.xml > "$RUNNER_TEMP/manifest-signed.bin"
          python3 scripts/patch_pam_manifest.py --verify "$RUNNER_TEMP/manifest-signed.bin"
          "$BUILD_TOOLS/aapt2" dump xmltree \
            --file AndroidManifest.xml "$SIGNED" \
            > "$RUNNER_TEMP/pam-manifest-signed-tree.txt"
          grep -Fq 'pageSizeCompat' "$RUNNER_TEMP/pam-manifest-signed-tree.txt"
          grep -Fq 'debuggable' "$RUNNER_TEMP/pam-manifest-signed-tree.txt"

          python3 scripts/report_elf_alignment.py "$SIGNED"

      - name: Unit tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile instrumentation tests
        shell: bash
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Compile release sources
        shell: bash
        run: ./gradlew :app:compileReleaseKotlin --stacktrace
