name: M0 Live Update Probe

on:
  push:
    branches:
      - feature/nowbar-m0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-live-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-m0:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Verify M0 scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q "compileSdk 36" app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
          grep -q "androidx.core:core-ktx:1.17.0" app/build.gradle
          grep -q "android.permission.POST_PROMOTED_NOTIFICATIONS" app/src/debug/AndroidManifest.xml
          grep -q "setRequestPromotedOngoing(true)" app/src/debug/java/com/kieronquinn/app/ambientmusicmod/debug/NowPlayingSurfaceProbe.kt
          grep -q "FLAG_PROMOTED_ONGOING" app/src/debug/java/com/kieronquinn/app/ambientmusicmod/debug/NowPlayingSurfaceProbe.kt
          if grep -R -E "NotificationListenerService|MediaSession|KeepAliveForegroundService|WakeLock|AlarmManager|WorkManager" \
            app/src/debug/java/com/kieronquinn/app/ambientmusicmod/debug/NowPlayingSurfaceProbe*.kt; then
            echo "Forbidden M0 mechanism found"
            exit 1
          fi
          if grep -q "<service" app/src/debug/AndroidManifest.xml; then
            echo "M0 must not add a service"
            exit 1
          fi

      - name: Build M0 APK and test APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Hash outputs
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          TEST_APK="$(find app/build/outputs/apk/androidTest/debug -type f -name '*.apk' | head -n 1 || true)"
          test -n "$APK"
          sha256sum "$APK" | tee M0-APK-SHA256.txt
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          if [ -n "$TEST_APK" ]; then
            sha256sum "$TEST_APK" | tee M0-TEST-APK-SHA256.txt
            echo "TEST_APK_PATH=$TEST_APK" >> "$GITHUB_ENV"
          fi

      - name: Upload M0 APK
        uses: actions/upload-artifact@v4
        with:
          name: AmbientMusicMod-M0-S25-Android16
          path: |
            ${{ env.APK_PATH }}
            ${{ env.TEST_APK_PATH }}
            M0-APK-SHA256.txt
            M0-TEST-APK-SHA256.txt
          if-no-files-found: warn
          retention-days: 14
