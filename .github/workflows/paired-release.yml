name: Paired Release Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/release-trigger

permissions:
  contents: write

concurrency:
  group: paired-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-paired-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NOWBAR_KEYSTORE_B64: ${{ secrets.NOWBAR_KEYSTORE_B64 }}
      NOWBAR_STORE_PASSWORD: ${{ secrets.NOWBAR_STORE_PASSWORD }}
      NOWBAR_KEY_ALIAS: ${{ secrets.NOWBAR_KEY_ALIAS }}
      NOWBAR_CERT_SHA256: ${{ secrets.NOWBAR_CERT_SHA256 }}
      PAM_135_SHA256: 11e3f12439d1b00e93174c6d2d9d6ff9000daec4e0bd03711d52cb25310223c1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="$(sed -n "s/^def tagName = '\([^']*\)'/\1/p" app/build.gradle | head -n1)"
          VERSION_CODE="$(sed -n 's/^def version = \([0-9][0-9]*\)/\1/p' app/build.gradle | head -n1)"
          RELEASE_TRIGGER="$(tr -d '[:space:]' < .github/release-trigger)"

          test -n "$RELEASE_TAG"
          test -n "$VERSION_CODE"
          test -n "$RELEASE_TRIGGER"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$VERSION_CODE" -ge 241
          test "$RELEASE_TRIGGER" = "$RELEASE_TAG"

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          {
            echo "### Paired release candidate"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Android versionCode: \`$VERSION_CODE\`"
            echo "- Release marker: \`$RELEASE_TRIGGER\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36 and build tools
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Load and verify stable PKCS12 signing key
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            NOWBAR_KEYSTORE_B64 \
            NOWBAR_STORE_PASSWORD \
            NOWBAR_KEY_ALIAS \
            NOWBAR_CERT_SHA256
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/ambient-oneui-stable.p12"
          printf '%s' "$NOWBAR_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          KEY_CERT="$(
            keytool -list -v \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -storepass "$NOWBAR_STORE_PASSWORD" \
              -alias "$NOWBAR_KEY_ALIAS" \
              | sed -n 's/^[[:space:]]*SHA256: //p' \
              | head -n1 \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"
          EXPECTED_CERT="$(printf '%s' "$NOWBAR_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"

          test -n "$KEY_CERT"
          test "$KEY_CERT" = "$EXPECTED_CERT"

          keytool -certreq \
            -alias "$NOWBAR_KEY_ALIAS" \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$NOWBAR_STORE_PASSWORD" \
            -keypass "$NOWBAR_STORE_PASSWORD" \
            -file "$RUNNER_TEMP/ambient-oneui-keycheck.csr" \
            >/dev/null
          test -s "$RUNNER_TEMP/ambient-oneui-keycheck.csr"
          rm -f "$RUNNER_TEMP/ambient-oneui-keycheck.csr"

          cat > local.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$NOWBAR_STORE_PASSWORD
          keyAlias=$NOWBAR_KEY_ALIAS
          keyPassword=$NOWBAR_STORE_PASSWORD
          EOF

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "EXPECTED_CERT_SHA256=$EXPECTED_CERT" >> "$GITHUB_ENV"

      - name: Unit tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile instrumentation tests
        shell: bash
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Build AMM release
        shell: bash
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Download and verify pinned Pixel Ambient Music 1.3.5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pair
          curl -fL --retry 3 \
            'https://github.com/KieronQuinn/NowPlaying/releases/download/1.3.5/NowPlaying-v1.3.5.apk' \
            -o pair/PixelAmbientMusic-1.3.5-official.apk

          echo "$PAM_135_SHA256  pair/PixelAmbientMusic-1.3.5-official.apk" \
            | sha256sum -c -

      - name: Build and verify paired release files
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APK_SIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT="$BUILD_TOOLS/aapt"

          AMM_SOURCE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$AMM_SOURCE"
          cp "$AMM_SOURCE" pair/AmbientMusicMod-OneUI.apk

          "$ZIPALIGN" -f -p 4 \
            pair/PixelAmbientMusic-1.3.5-official.apk \
            pair/PixelAmbientMusic-1.3.5-aligned.apk

          "$APK_SIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "$NOWBAR_KEY_ALIAS" \
            --ks-pass "pass:$NOWBAR_STORE_PASSWORD" \
            --key-pass "pass:$NOWBAR_STORE_PASSWORD" \
            --out pair/PixelAmbientMusic-1.3.5-paired.apk \
            pair/PixelAmbientMusic-1.3.5-aligned.apk

          "$APK_SIGNER" verify --verbose pair/AmbientMusicMod-OneUI.apk
          "$APK_SIGNER" verify --verbose pair/PixelAmbientMusic-1.3.5-paired.apk

          AMM_CERT="$($APK_SIGNER verify --print-certs pair/AmbientMusicMod-OneUI.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n1 | tr '[:upper:]' '[:lower:]')"
          PAM_CERT="$($APK_SIGNER verify --print-certs pair/PixelAmbientMusic-1.3.5-paired.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n1 | tr '[:upper:]' '[:lower:]')"

          test -n "$AMM_CERT"
          test -n "$PAM_CERT"
          test "$AMM_CERT" = "$PAM_CERT"
          test "$AMM_CERT" = "$EXPECTED_CERT_SHA256"

          AMM_PACKAGE="$($AAPT dump badging pair/AmbientMusicMod-OneUI.apk \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          PAM_PACKAGE="$($AAPT dump badging pair/PixelAmbientMusic-1.3.5-paired.apk \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          AMM_VERSION_CODE="$($AAPT dump badging pair/AmbientMusicMod-OneUI.apk \
            | sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" | head -n1)"
          AMM_VERSION_NAME="$($AAPT dump badging pair/AmbientMusicMod-OneUI.apk \
            | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" | head -n1)"

          test "$AMM_PACKAGE" = 'com.kieronquinn.app.ambientmusicmod'
          test "$PAM_PACKAGE" = 'com.kieronquinn.app.pixelambientmusic'
          test "$AMM_VERSION_CODE" = "$VERSION_CODE"
          test "$AMM_VERSION_NAME" = "$RELEASE_TAG"

          rm -f \
            pair/PixelAmbientMusic-1.3.5-official.apk \
            pair/PixelAmbientMusic-1.3.5-aligned.apk

          cd pair
          sha256sum \
            AmbientMusicMod-OneUI.apk \
            PixelAmbientMusic-1.3.5-paired.apk \
            > SHA256SUMS.txt

          test "$(wc -l < SHA256SUMS.txt)" -eq 2
          sha256sum -c SHA256SUMS.txt

      - name: Upload verified paired bundle
        uses: actions/upload-artifact@v4
        with:
          name: AmbientMusic-OneUI-Paired
          path: |
            pair/AmbientMusicMod-OneUI.apk
            pair/PixelAmbientMusic-1.3.5-paired.apk
            pair/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            printf '## Ambient Music for One UI — %s Experimental\n\n' "$RELEASE_TAG"
            cat <<'EOF'
          Experimental Samsung One UI derivative of Ambient Music Mod.

          ### Highlights
          - Recognised songs can surface in Samsung's real Now Bar through Android 16 promoted Live Update notifications.
          - Promoted Now Bar publishing is always enabled in this experimental derivative.
          - Includes a paired Pixel Ambient Music 1.3.5 APK signed with the same release identity required by the upstream signature-permission architecture.

          ### Verified device
          - Samsung Galaxy S25 (SM-S931B), Android 16 / One UI 8.x.

          ### Install
          Install both APKs from this release together. `SHA256SUMS.txt` contains the public file hashes.

          Unofficial community project. Not affiliated with Samsung, Google, or Kieron Quinn.
          EOF
          } > "$NOTES"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              pair/AmbientMusicMod-OneUI.apk \
              pair/PixelAmbientMusic-1.3.5-paired.apk \
              pair/SHA256SUMS.txt \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG Experimental" \
              --notes-file "$NOTES" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              pair/AmbientMusicMod-OneUI.apk \
              pair/PixelAmbientMusic-1.3.5-paired.apk \
              pair/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG Experimental" \
              --notes-file "$NOTES" \
              --prerelease
          fi

          test "$(gh release view "$RELEASE_TAG" --json tagName --jq '.tagName')" = "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')" = "true"

          mapfile -t RELEASE_ASSETS < <(
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort
          )
          EXPECTED_ASSETS=(
            AmbientMusicMod-OneUI.apk
            PixelAmbientMusic-1.3.5-paired.apk
            SHA256SUMS.txt
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED_ASSETS[@]}" | sort)

          test "${#RELEASE_ASSETS[@]}" -eq 3
          test "$(printf '%s\n' "${RELEASE_ASSETS[@]}")" = \
               "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"

          {
            echo "### Public prerelease"
            echo "- https://github.com/${GITHUB_REPOSITORY}/releases/tag/$RELEASE_TAG"
            echo "- Assets: verified paired APKs + SHA256SUMS.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Note non-main release behavior
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Verified bundle built successfully. Public GitHub Release publication is restricted to main." \
            >> "$GITHUB_STEP_SUMMARY"
