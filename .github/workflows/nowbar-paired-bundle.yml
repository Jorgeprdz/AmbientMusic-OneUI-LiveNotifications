name: Now Bar Paired Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nowbar-m1m2
    paths:
      - '.github/workflows/nowbar-paired-bundle.yml'

permissions:
  contents: read

concurrency:
  group: nowbar-paired-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-paired-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36 and build tools
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Create shared ephemeral signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/nowbar-pair.p12"
          STOREPASS='nowbar-test-password'
          ALIAS='nowbar-test'
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$STOREPASS" \
            -keypass "$STOREPASS" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=AmbientMusicMod NowBar Test, OU=Paired Bundle, O=Local Test, C=MX"
          cat > local.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$STOREPASS
          keyAlias=$ALIAS
          keyPassword=$STOREPASS
          EOF
          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "STOREPASS=$STOREPASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Unit tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build AMM release with shared key
        shell: bash
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Download official PAM 1.3.5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pair
          curl -fL --retry 3 \
            'https://github.com/KieronQuinn/NowPlaying/releases/download/1.3.5/NowPlaying-v1.3.5.apk' \
            -o pair/PixelAmbientMusic-1.3.5-official.apk
          sha256sum pair/PixelAmbientMusic-1.3.5-official.apk \
            | tee pair/PAM-1.3.5-OFFICIAL-SHA256.txt

      - name: Prepare and sign paired APKs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APK_SIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT="$BUILD_TOOLS/aapt"

          AMM_SOURCE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$AMM_SOURCE"
          cp "$AMM_SOURCE" pair/AmbientMusicMod-NowBar.apk

          "$ZIPALIGN" -f -p 4 \
            pair/PixelAmbientMusic-1.3.5-official.apk \
            pair/PixelAmbientMusic-1.3.5-aligned.apk

          "$APK_SIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STOREPASS" \
            --key-pass "pass:$STOREPASS" \
            --out pair/PixelAmbientMusic-1.3.5-resigned.apk \
            pair/PixelAmbientMusic-1.3.5-aligned.apk

          rm -f pair/PixelAmbientMusic-1.3.5-aligned.apk

          "$APK_SIGNER" verify --verbose --print-certs pair/AmbientMusicMod-NowBar.apk \
            | tee pair/AMM-CERT.txt
          "$APK_SIGNER" verify --verbose --print-certs pair/PixelAmbientMusic-1.3.5-resigned.apk \
            | tee pair/PAM-CERT.txt

          AMM_CERT="$($APK_SIGNER verify --print-certs pair/AmbientMusicMod-NowBar.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          PAM_CERT="$($APK_SIGNER verify --print-certs pair/PixelAmbientMusic-1.3.5-resigned.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"

          test -n "$AMM_CERT"
          test -n "$PAM_CERT"
          test "$AMM_CERT" = "$PAM_CERT"

          AMM_PACKAGE="$($AAPT dump badging pair/AmbientMusicMod-NowBar.apk \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          PAM_PACKAGE="$($AAPT dump badging pair/PixelAmbientMusic-1.3.5-resigned.apk \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"

          test "$AMM_PACKAGE" = 'com.kieronquinn.app.ambientmusicmod'
          test "$PAM_PACKAGE" = 'com.kieronquinn.app.pixelambientmusic'

          {
            echo '===== NOW BAR PAIRED BUNDLE ====='
            echo "SOURCE_COMMIT=$GITHUB_SHA"
            echo 'PAM_SOURCE=KieronQuinn/NowPlaying release 1.3.5'
            echo "AMM_PACKAGE=$AMM_PACKAGE"
            echo "PAM_PACKAGE=$PAM_PACKAGE"
            echo "AMM_CERT_SHA256=$AMM_CERT"
            echo "PAM_CERT_SHA256=$PAM_CERT"
            echo 'CERT_MATCH=PASS'
            echo 'APK_VERIFY=PASS'
            echo 'SIGNING_KEY=EPHEMERAL_TEST_KEY_NOT_FOR_PRODUCTION'
          } | tee pair/PAIR-REPORT.txt

          sha256sum \
            pair/AmbientMusicMod-NowBar.apk \
            pair/PixelAmbientMusic-1.3.5-resigned.apk \
            | tee pair/PAIR-APK-SHA256.txt

          rm -f pair/PixelAmbientMusic-1.3.5-official.apk

      - name: Upload paired test bundle
        uses: actions/upload-artifact@v4
        with:
          name: AmbientMusicMod-PAM-NowBar-Paired
          path: |
            pair/AmbientMusicMod-NowBar.apk
            pair/PixelAmbientMusic-1.3.5-resigned.apk
            pair/PAIR-REPORT.txt
            pair/PAIR-APK-SHA256.txt
            pair/PAM-1.3.5-OFFICIAL-SHA256.txt
            pair/AMM-CERT.txt
            pair/PAM-CERT.txt
          if-no-files-found: error
          retention-days: 14
