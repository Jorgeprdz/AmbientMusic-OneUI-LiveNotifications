name: Now Bar Paired Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nowbar-paired-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-paired-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NOWBAR_KEYSTORE_B64: ${{ secrets.NOWBAR_KEYSTORE_B64 }}
      NOWBAR_STORE_PASSWORD: ${{ secrets.NOWBAR_STORE_PASSWORD }}
      NOWBAR_KEY_ALIAS: ${{ secrets.NOWBAR_KEY_ALIAS }}
      NOWBAR_KEY_PASSWORD: ${{ secrets.NOWBAR_KEY_PASSWORD }}
      NOWBAR_CERT_SHA256: ${{ secrets.NOWBAR_CERT_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36 and build tools
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Load stable Now Bar signing key
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            NOWBAR_KEYSTORE_B64 \
            NOWBAR_STORE_PASSWORD \
            NOWBAR_KEY_ALIAS \
            NOWBAR_KEY_PASSWORD \
            NOWBAR_CERT_SHA256
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/nowbar-stable.p12"
          printf '%s' "$NOWBAR_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          KEY_CERT="$(
            keytool -list -v \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -storepass "$NOWBAR_STORE_PASSWORD" \
              -alias "$NOWBAR_KEY_ALIAS" \
              | sed -n 's/^[[:space:]]*SHA256: //p' \
              | head -n1 \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"

          test -n "$KEY_CERT"
          test "$KEY_CERT" = "$NOWBAR_CERT_SHA256"

          cat > local.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$NOWBAR_STORE_PASSWORD
          keyAlias=$NOWBAR_KEY_ALIAS
          keyPassword=$NOWBAR_KEY_PASSWORD
          EOF

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "STABLE_CERT_SHA256=$KEY_CERT" >> "$GITHUB_ENV"

      - name: Unit tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build AMM release with stable key
        shell: bash
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Download official PAM 1.3.5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pair
          curl -fL --retry 3 \
            'https://github.com/KieronQuinn/NowPlaying/releases/download/1.3.5/NowPlaying-v1.3.5.apk' \
            -o pair/PixelAmbientMusic-1.3.5-official.apk
          sha256sum pair/PixelAmbientMusic-1.3.5-official.apk \
            | tee pair/PAM-1.3.5-OFFICIAL-SHA256.txt

      - name: Prepare and sign stable paired APKs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APK_SIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT="$BUILD_TOOLS/aapt"

          AMM_SOURCE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$AMM_SOURCE"
          cp "$AMM_SOURCE" pair/AmbientMusicMod-NowBar.apk

          "$ZIPALIGN" -f -p 4 \
            pair/PixelAmbientMusic-1.3.5-official.apk \
            pair/PixelAmbientMusic-1.3.5-aligned.apk

          "$APK_SIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "$NOWBAR_KEY_ALIAS" \
            --ks-pass "pass:$NOWBAR_STORE_PASSWORD" \
            --key-pass "pass:$NOWBAR_KEY_PASSWORD" \
            --out pair/PixelAmbientMusic-1.3.5-resigned.apk \
            pair/PixelAmbientMusic-1.3.5-aligned.apk

          rm -f pair/PixelAmbientMusic-1.3.5-aligned.apk

          "$APK_SIGNER" verify --verbose --print-certs pair/AmbientMusicMod-NowBar.apk \
            | tee pair/AMM-CERT.txt
          "$APK_SIGNER" verify --verbose --print-certs pair/PixelAmbientMusic-1.3.5-resigned.apk \
            | tee pair/PAM-CERT.txt

          AMM_CERT="$($APK_SIGNER verify --print-certs pair/AmbientMusicMod-NowBar.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          PAM_CERT="$($APK_SIGNER verify --print-certs pair/PixelAmbientMusic-1.3.5-resigned.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"

          test -n "$AMM_CERT"
          test -n "$PAM_CERT"
          test "$AMM_CERT" = "$PAM_CERT"
          test "$AMM_CERT" = "$NOWBAR_CERT_SHA256"

          AMM_PACKAGE="$($AAPT dump badging pair/AmbientMusicMod-NowBar.apk \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          PAM_PACKAGE="$($AAPT dump badging pair/PixelAmbientMusic-1.3.5-resigned.apk \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"

          test "$AMM_PACKAGE" = 'com.kieronquinn.app.ambientmusicmod'
          test "$PAM_PACKAGE" = 'com.kieronquinn.app.pixelambientmusic'

          {
            echo '===== NOW BAR STABLE PAIRED BUNDLE ====='
            echo "SOURCE_COMMIT=$GITHUB_SHA"
            echo 'PAM_SOURCE=KieronQuinn/NowPlaying release 1.3.5'
            echo "AMM_PACKAGE=$AMM_PACKAGE"
            echo "PAM_PACKAGE=$PAM_PACKAGE"
            echo "AMM_CERT_SHA256=$AMM_CERT"
            echo "PAM_CERT_SHA256=$PAM_CERT"
            echo "EXPECTED_CERT_SHA256=$NOWBAR_CERT_SHA256"
            echo 'CERT_MATCH=PASS'
            echo 'STABLE_CERT_MATCH=PASS'
            echo 'APK_VERIFY=PASS'
            echo 'SIGNING_KEY=STABLE_GITHUB_SECRET'
          } | tee pair/PAIR-REPORT.txt

          sha256sum \
            pair/AmbientMusicMod-NowBar.apk \
            pair/PixelAmbientMusic-1.3.5-resigned.apk \
            | tee pair/PAIR-APK-SHA256.txt

          rm -f pair/PixelAmbientMusic-1.3.5-official.apk

      - name: Upload stable paired test bundle
        uses: actions/upload-artifact@v4
        with:
          name: AmbientMusicMod-PAM-NowBar-Stable
          path: |
            pair/AmbientMusicMod-NowBar.apk
            pair/PixelAmbientMusic-1.3.5-resigned.apk
            pair/PAIR-REPORT.txt
            pair/PAIR-APK-SHA256.txt
            pair/PAM-1.3.5-OFFICIAL-SHA256.txt
            pair/AMM-CERT.txt
            pair/PAM-CERT.txt
          if-no-files-found: error
          retention-days: 14
